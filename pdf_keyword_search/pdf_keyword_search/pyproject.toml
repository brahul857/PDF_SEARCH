[project]
name = "pdf-keyword-search"
version = "0.1.0"
description = "Streamlit app for searching text and values in PDF documents"
requires-python = ">=3.10"
dependencies = [
    "streamlit[pdf]>=1.35.0",
    "streamlit-pdf>=1.0.0",
    "pymupdf>=1.24.0",
    "pandas>=2.0.0",
    "pdfplumber",
    "sqlalchemy>=2.0.55",
    "rapidocr-onnxruntime>=1.3.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    "pyodbc>=5.3.0",
    "chromadb>=1.5.9",
]

[tool.uv]
package = false
